# /etc/nginx/sites-available/dh-dashboard
#
# 배포 시 server_name 을 실제 도메인으로 바꾸고 아래 명령으로 활성화합니다.
#   sudo ln -sf /etc/nginx/sites-available/dh-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 는 certbot 이 이 파일을 자동으로 수정해 443 블록을 추가합니다.
#   sudo certbot --nginx -d monitor.example.com

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10M;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # SSE 실시간 스트림.
    # 버퍼링이 켜져 있으면 이벤트가 nginx 에 고여 실시간 갱신이 멈춥니다.
    # ------------------------------------------------------------------
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # Next.js 정적 자산은 길게 캐시합니다 (파일명에 해시가 포함됨).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
